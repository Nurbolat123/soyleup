services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soyleup
      POSTGRES_PASSWORD: soyleup
      POSTGRES_DB: soyleup
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soyleup"]
      interval: 5s
      retries: 10

  # Очередь уведомлений (BullMQ) — этап 6
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-совместимое хранилище для аудио (записи речи, домашние задания).
  # MinIO перестал бесплатно раздавать готовые образы (Docker Hub — с 23.10.2025,
  # quay.io — требует логин с 24.09.2025). Используем пересборку от Chainguard —
  # тот же MinIO, раздаётся свободно и без ограничений.
  minio:
    image: cgr.dev/chainguard/minio:latest
    environment:
      MINIO_ROOT_USER: soyleup
      MINIO_ROOT_PASSWORD: soyleup-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    command: server /data --console-address ":9001"

  api:
    build: ./apps/api
    profiles: ["full"] # локально API удобнее запускать через npm run dev
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://soyleup:soyleup@postgres:5432/soyleup?schema=public
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
